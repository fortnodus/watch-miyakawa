name: watch-miyakawa

on:
  schedule:
    - cron: "*/10 * * * *"   # UTC基準。10分ごと（GitHub側の混雑で数分遅れることあり）
  workflow_dispatch: {}       # 手動実行ボタン

concurrency:
  group: watch-miyakawa
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # 前回の状態（どの日が空有りだったか）を引き継ぐ
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      # ubuntu-latest には Python が最初から入っているので、追加インストールは不要
      - name: Check calendar
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 watch.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
